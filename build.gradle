// =====================================================================
// bustour 빌드 설정 (Gradle, Groovy 문법)
//
// ※ start.spring.io(또는 인텔리제이 New Project → Spring Boot)가 만든
//   build.gradle을 이 파일로 "교체"한다.
//   - 마법사가 만든 파일과 스타터 이름이 다르면 → 마법사 쪽 이름이 맞다 (최신 기준)
//   - Boot 버전은 concurrency-boot에서 실행에 성공한 4.1.2로 맞췄다
//
// ★ 이 파일을 바꾼 뒤에는 인텔리제이 오른쪽 위의 코끼리 아이콘
//   (Load Gradle Changes, 단축키 Ctrl+Shift+O)을 눌러야 반영된다.
// =====================================================================

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'          // ★ 스프링 부트 버전
    id 'io.spring.dependency-management' version '1.1.7'  // 라이브러리 버전을 부트가 맞춰 줌
                                                           // → 아래 dependencies에 버전을 안 써도 됨
}

group = 'com.kwon'               // 패키지 앞부분 (com.kwon.bustour)
version = '0.0.1-SNAPSHOT'       // 내 앱의 버전 (jar 파일 이름에 붙음)

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)      // JDK 21
    }
}

// Lombok: compileOnly로 넣은 라이브러리를 어노테이션 처리기(annotationProcessor)도 쓰게 연결
configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()               // 라이브러리를 받아 오는 곳 (인터넷의 공용 저장소)
}

dependencies {
    // ----- 웹 (컨트롤러, 내장 톰캣) -----
    // Boot 4부터 이름이 web → webmvc 로 바뀜
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // ----- 화면: 타임리프 (JSP 대신 서버에서 HTML을 만듦) -----
    // 3단계(화면)에서 쓰지만, 지금 넣어 두면 build.gradle을 다시 안 고쳐도 됨
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // ----- 입력 검증: @Min(1) @Max(10) 같은 Bean Validation (규칙 R3 인원 1~10명) -----
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // ----- DB -----
    // JPA(Hibernate) + JDBC(JdbcTemplate, HikariCP 커넥션풀)가 함께 들어 있음
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // MySQL 드라이버: 실행할 때만 필요 (코드에서 직접 import 하지 않음)
    runtimeOnly 'com.mysql:mysql-connector-j'

    // ----- 시큐리티 (4단계) -----
    // 넣는 순간 모든 URL에 로그인이 걸리고, POST에는 CSRF 토큰이 필요해진다.
    // → config/SecurityConfig.java 에서 "로그인 없이 볼 수 있는 주소(permitAll)"를 정한다.
    // ※ 타임리프용 시큐리티 태그(sec:authorize) 라이브러리는 넣지 않았다.
    //   로그인 정보는 web/GlobalModelAdvice 가 모든 화면에 loginName 으로 넘겨 준다 (라이브러리 버전 걱정 없음)
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // ★ 8단계: 캐시 — @Cacheable 을 쓰게 해 주는 스타터 + Caffeine(앱 메모리 캐시, 만료 시간 지원)
    //   버전을 안 써도 부트가 맞는 버전을 골라 줌 (dependency-management)
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // ----- Lombok (@Getter, @RequiredArgsConstructor 등) -----
    // 컴파일할 때만 필요하고 jar에는 안 들어감
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ----- 테스트 (JUnit) -----
    // Boot 4부터 테스트 스타터도 기술별로 나뉨
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    // 시큐리티 테스트 도구 (6단계): MockMvc 에서 "로그인한 사용자로" / "CSRF 토큰 넣어서" 요청을 흉내 냄
    //   .with(user(loginUser)) , .with(csrf())
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // [추가]2026.11.22권성애 Actuator — 커넥션 풀(acquire · usage · pending) 등 앱 내부 수치를 주소로 꺼냄
    //   버전은 부트가 맞춰 줌. 관리 포트 9282 는 application.yml 의 management 참고
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
}

tasks.named('test') {
    useJUnitPlatform()           // JUnit 5(이상)로 테스트 실행
}
