# =====================================================================
# docker-compose.yml : 서버에서 컨테이너 4개를 한 번에 띄우기 (10단계)
# [추가]2026.11.13권성애
#
#   인터넷 ──80/443──▶ [nginx] ──http://app:8282──▶ [app] ──mysql:3306──▶ [mysql]
#                         ▲
#                   [certbot] 인증서 발급 · 갱신 때만 잠깐 실행
#
# ★ 밖(인터넷)에 열리는 포트는 nginx 의 80 · 443 뿐이다.
#   app(8282) · mysql(3306) 은 ports 를 쓰지 않아 도커 내부 네트워크에서만 보인다.
#
# ★ ${이름} 은 같은 폴더의 .env 에서 값을 가져온다 (비밀 값은 이 파일에 쓰지 않음)
#
# 자주 쓰는 명령 (서버의 ~/bustour 폴더에서)
#   docker compose pull               최신 앱 이미지 받기
#   docker compose up -d              전부 띄우기 (-d = 뒤에서 실행, 터미널을 닫아도 계속)
#   docker compose ps                 상태 보기
#   docker compose logs -f app        앱 로그 계속 보기 (Ctrl+C 로 빠져나옴)
#   docker compose down               전부 내리기 (★ 볼륨 = DB 데이터는 남는다)
#   docker compose down -v            ⚠ 볼륨까지 삭제 = DB 데이터 전부 사라짐
# =====================================================================

# 프로젝트 이름: 컨테이너 · 볼륨 · 네트워크 이름 앞에 붙는다 (예: 볼륨 bustour_mysql-data)
#   안 쓰면 폴더 이름이 쓰여서, 폴더를 옮기면 "다른 프로젝트"로 보고 DB 볼륨을 새로 만들 수 있다
name: bustour

services:

  # -------------------------------------------------------------------
  # MySQL 8.0 — 데이터는 mysql-data 볼륨에 저장 (컨테이너를 지워도 남음)
  # -------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: bustour-mysql
    restart: unless-stopped          # 서버 재부팅 · 오류로 꺼져도 자동으로 다시 켬 (직접 stop 한 경우는 제외)
    environment:
      # ★ 아래 값들은 "볼륨이 비어 있는 첫 실행" 때만 쓰인다 (나중에 바꿔도 이미 만든 계정은 그대로)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bustour        # 스키마 bustour 를 만들어 줌 (= 01_create_db_user.sql 의 CREATE DATABASE)
      MYSQL_USER: ${DB_USERNAME}     # 앱 계정을 만들고 bustour.* 에 모든 권한을 줌
      MYSQL_PASSWORD: ${DB_PASSWORD} #   → 01번 SQL 의 'bustour'@'localhost' 대신 '%'(어느 컨테이너에서든) 계정이 생김
      TZ: Asia/Seoul
    command:
      # MySQL 서버 옵션 (my.cnf 대신 여기에)
      - --character-set-server=utf8mb4          # 한글 · 이모지
      - --collation-server=utf8mb4_0900_ai_ci   # 로컬과 같은 정렬 규칙
      - --default-time-zone=+09:00              # DB 의 NOW() 도 한국 시각 → /ping 의 diffMinutes 0
      - --innodb-buffer-pool-size=256M          # 2GB 서버라 메모리 상한 (기본 128M, 데이터가 작아 256M 이면 충분)
      - --max-connections=50                    # 앱 풀 20 + 여유 (기본 151 은 메모리 낭비)
      - --performance-schema=OFF                # 성능 측정 기능 끄기 → 메모리 약 200MB 절약
    volumes:
      # 이름 있는 볼륨: DB 파일 저장소 (맨 아래 volumes: 에 선언)
      - mysql-data:/var/lib/mysql
      # /docker-entrypoint-initdb.d 안의 .sql 은 "볼륨이 비어 있을 때 딱 한 번" 이름 순서대로 실행된다
      #   02 = 테이블 7개 (맨 위 USE bustour; 그대로 사용) / 03 = 샘플 데이터 (오늘부터 14일 회차)
      #   ★ 01 은 넣지 않음 (위 environment 가 대신함) · 04 는 확인용 · 05 는 k6 용
      #   :ro = 읽기 전용 (컨테이너가 원본 파일을 고치지 못함)
      - ./db/02_tables.sql:/docker-entrypoint-initdb.d/02_tables.sql:ro
      - ./db/03_sample_data.sql:/docker-entrypoint-initdb.d/03_sample_data.sql:ro
    # ports: 없음 → 서버 밖에서 3306 으로 접속 불가 (워크벤치로 보려면 SSH 터널 사용)
    healthcheck:
      # "MySQL 이 접속을 받을 준비가 됐나?" 를 10초마다 확인
      #   -h 127.0.0.1 : TCP 로 확인 (첫 실행 때 SQL 을 돌리는 임시 서버는 TCP 를 안 열어서, 끝나기 전엔 실패로 나옴)
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12                    # 12번(약 2분) 연속 실패하면 unhealthy
      start_period: 30s              # 처음 30초는 실패해도 셈하지 않음 (첫 초기화 시간)

  # -------------------------------------------------------------------
  # 스프링 부트 앱 — GitHub Actions 가 ghcr.io 에 올린 이미지를 pull 해서 실행
  # -------------------------------------------------------------------
  app:
    image: ${APP_IMAGE}              # 예) ghcr.io/githubid/bustour:latest (.env)
    container_name: bustour-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy   # MySQL healthcheck 가 통과한 뒤에 앱을 켬 (DB 연결 실패로 앱이 죽는 것 방지)
    environment:
      # [추가]2026.11.14권성애 — .env 로 바꿀 수 있게 (평소 prod / 부하테스트 때 prod,k6)
      #   prod,k6 = prod 를 먼저 읽고 k6 가 덮어씀 → DB bustour_k6 · 가짜 PG · 풀 K6_POOL
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      # DB 주소: 컨테이너끼리는 "서비스 이름"이 곧 호스트 이름 (localhost 아님!)
      DB_HOST: mysql
      DB_PORT: 3306                  # 컨테이너 안 MySQL 기본 포트 (로컬 PC 의 3307 과 다름)
      DB_NAME: bustour
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      PG_TYPE: ${PG_TYPE:-fake}      # :-fake = .env 에 없으면 fake
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      KMA_SERVICE_KEY: ${KMA_SERVICE_KEY:-}
      # [추가]2026.11.14권성애 — k6 프로필의 커넥션 풀 크기 (application-k6.yml 의 ${K6_POOL:30})
      #   부하테스트 때 .env 에서 10 · 20 · 30 으로 바꿔 가며 측정, 평소(prod)에는 쓰이지 않음
      K6_POOL: ${K6_POOL:-20}
      TZ: Asia/Seoul
      # JVM 메모리를 바꾸고 싶으면 아래 주석을 풀기 (Dockerfile 기본값: -Xms256m -Xmx512m)
      # JAVA_OPTS: "-Xms256m -Xmx640m -Duser.timezone=Asia/Seoul"
    expose:
      - "8282"                       # 도커 내부 네트워크에만 공개 (nginx 가 app:8282 로 접근)
    logging:
      # 로그 파일이 무한히 커져 디스크가 차는 것 방지: 10MB 씩 최대 3개
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------------------------
  # Nginx — 80/443 을 받아 app:8282 로 넘김 (리버스 프록시) + HTTPS 처리
  # -------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine         # alpine = 아주 작은 리눅스 기반 (약 20MB)
    container_name: bustour-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"                      # 서버의 80 → 컨테이너 80 (왼쪽 = 서버, 오른쪽 = 컨테이너)
      - "443:443"
    volumes:
      # 저장소의 nginx/nginx.conf 를 nginx 기본 사이트 설정 자리에 끼움
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # certbot 과 같은 폴더를 공유
      #   www  : 인증 확인 파일(/.well-known/acme-challenge/…)을 nginx 가 보여 줌
      #   conf : 발급된 인증서(fullchain.pem, privkey.pem)를 nginx 가 읽음
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------------------------
  # Certbot — Let's Encrypt 인증서 발급 · 갱신 (항상 떠 있지 않음)
  #   profiles 에 넣으면 docker compose up -d 때는 켜지지 않고, 직접 run 할 때만 실행된다
  #
  #   발급(처음 한 번): docker compose run --rm certbot
  #   갱신(크론으로)  : docker compose run --rm certbot renew && docker compose exec nginx nginx -s reload
  #     ※ run 뒤에 renew 를 쓰면 아래 command 대신 renew 가 실행된다
  #   --rm = 끝나면 컨테이너 자동 삭제
  # -------------------------------------------------------------------
  certbot:
    image: certbot/certbot
    container_name: bustour-certbot
    profiles: ["certbot"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    # webroot 방식: certbot 이 www 폴더에 확인 파일을 놓으면 → Let's Encrypt 가 http://도메인/.well-known/… 로 확인
    #   → 그래서 발급 전에 nginx 가 80 번에서 떠 있어야 한다
    command: >
      certonly --webroot -w /var/www/certbot
      -d bustour.trave2026.kro.kr
      --email ${CERTBOT_EMAIL} --agree-tos --no-eff-email --non-interactive

# 이름 있는 볼륨 선언 (도커가 /var/lib/docker/volumes/ 아래에 보관)
volumes:
  mysql-data:
