# =====================================================================
# JUnit 전용 설정 (테스트 클래스에 @ActiveProfiles("test") 를 붙이면 사용됨)
#
# ★ 왜 따로 두나?
#   동시성 테스트는 시작할 때 데이터를 지우고 다시 넣는다.
#   개발용 스키마(bustour)를 쓰면 샘플 데이터가 날아간다 → 테스트 전용 스키마 bustour_test
#
#   main의 application.yml을 먼저 읽고, 여기 적은 값만 "덮어쓴다".
#   (url만 바꾸고 나머지 hikari·jpa 설정은 그대로 사용)
#
# ※ DB_NAME 환경변수로 바꾸지 않고 url 전체를 적은 이유:
#   JUnit 실행 설정에 실수로 DB_NAME=bustour 를 넣어도 개발 DB를 건드리지 않게
# =====================================================================

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/bustour_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true

# ★ 7단계
#   scheduler.enabled=false : 스케줄러가 테스트 데이터를 몰래 만료시키지 않게 (테스트가 expireDueHolds 를 직접 부름)
#   approve-delay-ms: 0     : 테스트를 빠르게 (지연이 필요한 테스트는 FakePgClient.setApproveDelayMs 로 따로)
bustour:
  pg:
    type: fake                     # ★ 실행 설정에 PG_TYPE=toss 가 있어도 JUnit 은 항상 가짜 PG (토스 서버를 부르지 않게)
    fake:
      approve-delay-ms: 0
  scheduler:
    enabled: false
  # ★ 8단계: 테스트는 기상청을 부르지 않음 (키를 빈칸으로 고정 → 실행 설정에 KMA_SERVICE_KEY 가 있어도 무시)
  #   캐시 테스트는 KmaWeatherClient 를 가짜(@MockitoBean)로 바꿔서 확인
  weather:
    service-key: ""
