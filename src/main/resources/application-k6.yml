# =====================================================================
# 9단계 k6 부하테스트 전용 설정 — 실행 설정 VM options 에 -Dspring.profiles.active=k6
#   (또는 환경변수 SPRING_PROFILES_ACTIVE=k6)
# ★ 개발 DB(bustour)가 아니라 bustour_k6 / 결제는 반드시 가짜 PG (토스 서버에 부하 금지)
# =====================================================================
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/bustour_k6?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    hikari:
      # ★ 실험 B: 커넥션 풀 크기 (기본 application.yml 은 10)
      #   RATE 200 + 회차 분산(실험 A)에서 "active=10, idle=0, waiting=187" → 커넥션 앞에서 줄을 섬
      #   20 으로 늘려 처리량이 오르고 waiting · 503 이 줄어드는지 본다
      #   (실행할 때 -e 처럼 바꾸고 싶으면 환경변수 K6_POOL=30 → ${K6_POOL:20})
      maximum-pool-size: ${K6_POOL:30}
  thymeleaf:
    cache: true                    # 측정 중에는 화면 템플릿을 매번 읽지 않게 (운영과 같게)

bustour:
  pg:
    type: fake                     # ★ PG_TYPE=toss 가 있어도 무시하고 가짜 PG
    fake:
      approve-delay-ms: 300        # 외부 결제가 300ms 걸린다고 가정 (트랜잭션 밖이라 커넥션을 잡지 않음)

logging:
  level:
    com.kwon.bustour: warn         # 측정 중 로그가 많으면 그 자체가 느려짐
