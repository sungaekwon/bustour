<!DOCTYPE html>
<!--
  =====================================================================
  payment/checkout.html : 결제 화면 (GET /payments/{예약번호}, 로그인 필요) — 7단계
  - model: checkout = CheckoutView (주문 내용 · 결제 가능 여부 · 남은 초)
           pgType = "fake" 또는 "toss" (application.yml 의 bustour.pg.type)
           tossClientKey = 토스 클라이언트 키 (test_ck_…, 브라우저용이라 화면에 넣어도 됨)

  ★ 지금은 "가짜 결제창"(테스트용). 버튼 3개
      결제 승인   : 결제 번호 fake_xxxx 를 만들어 확정 API 호출 → 성공
      카드 거절   : 결제 번호 fake_decline_xxxx → 가짜 PG 가 거절 (예약은 결제 대기 그대로)
      금액 조작   : 금액을 1,000원 적게 보냄 → 서버가 예약 금액과 비교해 거절 + 기록 (규칙 R15 확인용)
  ★ pgType 이 toss 면 가짜 결제창 대신 "토스페이먼츠로 결제" 버튼
    → 토스 결제창 → 성공하면 토스가 /payments/{id}/toss/success 로 보냄 → 서버가 승인 · 확정 (PaymentController)

  ★ 금액 · 주문번호는 화면에 보여 줄 뿐, 서버는 예약할 때 저장한 금액으로 다시 확인한다.
  =====================================================================
-->
<html th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <title>결제 - 부산한바퀴</title>
</head>
<body>
<main>
  <section class="container section">
    <div class="pay-box">
      <h1 class="form-title">결제하기</h1>

      <!-- 주문 내용 (dl = 이름 · 값 목록) -->
      <dl class="pay-summary">
        <dt>예약번호</dt> <dd th:text="${checkout.reservationId}">12</dd>
        <dt>투어</dt>     <dd th:text="${checkout.tourName}">해운대·광안리 야경 투어</dd>
        <dt>출발</dt>     <dd th:text="${#temporals.format(checkout.startAt, 'M월 d일 (E) HH:mm')}">11월 12일 (목) 19:00</dd>
        <dt>인원</dt>     <dd th:text="|${checkout.headcount}명|">2명</dd>
        <dt>주문번호</dt> <dd th:text="${checkout.orderId}">BT12-a1b2c3d4</dd>
        <dt>결제 금액</dt>
        <dd class="pay-amount" th:text="|${#numbers.formatInteger(checkout.amount, 1, 'COMMA')}원|">20,000원</dd>
      </dl>

      <!-- 결제할 수 없을 때 (이미 결제 · 만료 · 시간 지남): 이유 + 내 예약으로 -->
      <div th:unless="${checkout.payable}">
        <p class="alert alert-error" th:text="${checkout.notice}">이미 결제가 끝난 예약입니다.</p>
        <a class="btn btn-primary btn-block" th:href="@{/my/reservations}">내 예약 보기</a>
      </div>

      <!-- 결제할 수 있을 때 -->
      <div th:if="${checkout.payable}">
        <p class="pay-remain">남은 결제 시간
          <!-- my-reservations.js 가 1초마다 다시 계산 (0 이 되면 새로고침 → 위의 "시간 지남" 안내로 바뀜) -->
          <strong class="countdown" th:data-remain="${checkout.remainSeconds}">10:00</strong>
        </p>

        <!-- (pgType = fake) 가짜 결제창: 자바스크립트가 data-* 값을 읽어 확정 API 를 부른다 -->
        <div class="fake-pg" id="fake-pg" th:if="${pgType == 'fake'}"
             th:data-reservation-id="${checkout.reservationId}"
             th:data-amount="${checkout.amount}">
          <p class="fake-pg-title">가짜 결제창 <span class="fake-pg-tag">테스트용 · 실제 돈이 나가지 않음</span></p>
          <div class="fake-pg-actions">
            <button type="button" class="btn btn-primary" data-pay="approve">결제 승인</button>
            <button type="button" class="btn btn-outline" data-pay="decline">카드 거절</button>
            <button type="button" class="btn btn-outline" data-pay="tamper">금액 조작 테스트</button>
          </div>
          <!-- 서버가 돌려준 결과 문장 -->
          <p class="alert" id="pay-message" hidden></p>
        </div>

        <!-- (pgType = toss) 토스 결제 버튼: data-* 값으로 토스 결제창을 띄운다 (static/js/payment-checkout.js)
             주문번호 · 금액은 서버가 만든 값. 결제 후 서버가 이 값과 토스가 돌려준 값을 다시 비교한다 -->
        <div class="toss-pay" id="toss-pay" th:if="${pgType == 'toss'}"
             th:data-client-key="${tossClientKey}"
             th:data-reservation-id="${checkout.reservationId}"
             th:data-amount="${checkout.amount}"
             th:data-order-id="${checkout.orderId}"
             th:data-order-name="|${checkout.tourName} ${checkout.headcount}명|">
          <button type="button" class="btn btn-primary btn-block" id="toss-pay-btn">토스페이먼츠로 결제하기</button>
          <p class="modal-note">테스트 키로 연결되어 있어 실제 돈이 나가지 않습니다.</p>
          <p class="alert alert-error" id="toss-message" hidden></p>
        </div>

        <p class="modal-note">결제하지 않으려면 <a th:href="@{/my/reservations}">내 예약</a>에서 포기할 수 있어요.
          10분이 지나면 자동으로 취소되고 자리가 돌아갑니다.</p>
      </div>
    </div>
  </section>

  <!-- (toss) 토스 결제 SDK v2 — 결제창을 띄우는 TossPayments() 함수를 만들어 줌. 반드시 payment-checkout.js 보다 먼저 -->
  <script th:if="${pgType == 'toss' and checkout.payable}" src="https://js.tosspayments.com/v2/standard"></script>
  <!-- 남은 시간 카운트다운은 내 예약 화면과 같은 스크립트를 함께 씀 -->
  <script th:src="@{/js/my-reservations.js}"></script>
  <script th:src="@{/js/payment-checkout.js}"></script>
</main>
</body>
</html>
