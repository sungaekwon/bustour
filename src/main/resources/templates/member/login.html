<!DOCTYPE html>
<!--
  =====================================================================
  member/login.html : 로그인 화면 (GET /login)

  ★ 이 폼은 컨트롤러가 아니라 "시큐리티 필터"로 간다 (POST /login, SecurityConfig.formLogin)
    입력칸 name 은 설정과 같아야 함: phone (usernameParameter), password (passwordParameter)

  ★ th:action 을 쓰는 이유: CSRF 토큰이 숨은 입력칸(_csrf)으로 "자동"으로 들어간다.
    그냥 action="/login" 이라고 쓰면 토큰이 빠져서 403 Forbidden.

  ★ 주소 뒤 ?error / ?signup 으로 안내 문장 고르기
    ${param.error}  : 주소에 ?error 가 있으면 값이 있음 → 로그인 실패
    ${param.signup} : 회원가입 직후 (AuthController 가 /login?signup 으로 보냄)
  =====================================================================
-->
<html th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <title>로그인 - 부산한바퀴</title>
</head>
<body>
<main>
  <section class="container section">
    <div class="form-box">
      <h1 class="form-title">로그인</h1>

      <!-- 안내 문장 (둘 중 해당하는 것만 보임) -->
      <p class="alert alert-ok" th:if="${param.signup != null}">가입이 완료되었습니다. 로그인해 주세요.</p>
      <!-- 번호가 없는지, 비밀번호가 틀렸는지 구분하지 않음 (가입 여부가 새어 나가지 않게) -->
      <p class="alert alert-error" th:if="${param.error != null}">휴대폰 번호 또는 비밀번호가 맞지 않습니다.</p>

      <form th:action="@{/login}" method="post">
        <div class="form-row">
          <label for="phone">휴대폰 번호</label>
          <!-- inputmode="numeric" : 휴대폰에서 숫자 키패드가 뜸 / autocomplete : 브라우저 자동 입력 -->
          <input type="text" id="phone" name="phone" inputmode="numeric" autocomplete="username"
                 placeholder="010-1234-5678" required>
        </div>
        <div class="form-row">
          <label for="password">비밀번호</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">로그인</button>
      </form>

      <p class="form-foot">아직 회원이 아니신가요? <a th:href="@{/signup}">회원가입</a></p>
    </div>
  </section>
</main>
</body>
</html>
