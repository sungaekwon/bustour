# =====================================================================
# deploy.yml : GitHub Actions — main 에 push 하면 이미지 빌드 → ghcr.io 에 올리기 (10단계 ⑦-1)
# [추가]2026.11.13권성애
#
#   push(main) ──▶ [GitHub 의 리눅스 서버(ubuntu-latest)]
#                    ① 코드 받기 → ② ghcr.io 로그인 → ③ buildx 준비 → ④ Dockerfile 로 빌드 + push
#                                                                     ▼
#                                     ghcr.io/sungaekwon/bustour:latest  (+ :커밋SHA)
#
# ★ 이 파일 위치는 반드시 저장소 루트의 .github/workflows/ 아래 (GitHub 가 여기만 읽음)
# ★ 비밀 값을 하나도 쓰지 않는다
#   - ghcr.io 로그인 = GitHub 가 실행할 때마다 자동으로 만들어 주는 GITHUB_TOKEN (1회용, 끝나면 사라짐)
#   - 앱 비밀 값(DB 비밀번호 · 토스 키 · 기상청 키)은 이미지에 넣지 않고 서버의 .env 에서 넣는다
#
# 결과 확인: 저장소 → Actions 탭 → 맨 위 실행 기록 (초록 체크 = 성공, 빨간 X = 실패 → 눌러서 로그 보기)
# 처음 성공한 뒤 한 번만: GitHub 프로필 → Packages → bustour → Package settings → Change visibility → Public
#   (public 이어야 서버가 로그인 없이 docker compose pull 가능)
#
# [추가]2026.11.14권성애 — ⑦-2 자동 배포 (맨 아래 deploy job)
#   build 가 성공하면 → GitHub 서버가 SSH 로 Lightsail 에 접속해서
#   git pull → docker compose pull app → up -d → /ping 확인 까지 대신 해 준다
#   필요한 저장소 Secrets (Settings → Secrets and variables → Actions → New repository secret)
#     SERVER_HOST    : Lightsail 고정 IP
#     SERVER_USER    : ubuntu
#     SERVER_SSH_KEY : 배포 전용 SSH 개인 키 전체 (-----BEGIN ... END----- 줄까지)
# =====================================================================

name: build-and-push              # Actions 탭에 보이는 이름

# ---------------------------------------------------------------------
# 언제 실행하나
# ---------------------------------------------------------------------
on:
  push:
    branches: [main]              # main 브랜치에 push 될 때만 (다른 브랜치는 실행 안 함)
  workflow_dispatch:              # Actions 탭 → 이 워크플로 → "Run workflow" 버튼으로 손으로 실행 가능

# 같은 브랜치에 push 가 연달아 오면 앞의 것이 끝난 뒤 다음 것을 실행 (순서대로 줄 세우기)
# [추가]2026.11.14권성애 — cancel-in-progress: true → false
#   배포(deploy job)가 생겼기 때문. 서버에서 git pull 은 했는데 up 전에 취소되면
#   코드와 실행 중인 컨테이너가 어긋난 "반쯤 배포된" 상태가 될 수 있다 → 취소하지 않고 기다리게
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

# ---------------------------------------------------------------------
# GITHUB_TOKEN 에 줄 권한 (필요한 것만)
#   contents: read   = 저장소 코드 읽기 (checkout)
#   packages: write  = ghcr.io 에 이미지 올리기
# ---------------------------------------------------------------------
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest        # GitHub 가 빌려주는 리눅스 서버 (메모리 넉넉 → Gradle 빌드를 여기서)

    steps:
      # ① 저장소 코드를 이 리눅스 서버로 받기 (git clone 과 같음)
      - name: 코드 받기 (checkout)
        uses: actions/checkout@v4

      # 이미지 이름 만들기
      #   ghcr.io 이미지 이름은 반드시 소문자 → ${변수,,} = bash 에서 "전부 소문자로"
      #   github.repository_owner = sungaekwon → IMAGE=ghcr.io/sungaekwon/bustour
      #   $GITHUB_ENV 에 적으면 다음 단계들에서 ${{ env.IMAGE }} 로 쓸 수 있다
      - name: 이미지 이름 정하기
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${OWNER}/bustour" >> "$GITHUB_ENV"

      # ② ghcr.io 로그인
      #   username = push 한 사람의 GitHub 아이디, password = 자동 토큰 (Secrets 에 따로 넣을 필요 없음)
      - name: ghcr.io 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ③ buildx 준비 = 도커의 새 빌드 도구 (아래 캐시 기능을 쓰려면 필요)
      - name: Docker Buildx 준비
        uses: docker/setup-buildx-action@v3

      # ④ Dockerfile 로 빌드하고 바로 push
      - name: 이미지 빌드 + push
        uses: docker/build-push-action@v6
        with:
          context: .                       # 저장소 루트 = 빌드 재료 (.dockerignore 적용)
          file: ./Dockerfile
          platforms: linux/amd64           # Lightsail 서버 CPU (인텔/AMD 64비트)
          push: true
          # 태그 두 개
          #   latest   : 서버의 .env APP_IMAGE 가 가리키는 "최신"
          #   커밋SHA  : 이 커밋으로 만든 이미지 (문제 생기면 APP_IMAGE=...:이전SHA 로 바꿔 되돌리기)
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # 이미지에 "어느 저장소에서 왔는지" 표시 → ghcr.io 패키지가 bustour 저장소에 자동으로 연결됨
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # 빌드 캐시를 GitHub Actions 캐시에 저장
          #   Dockerfile 의 "라이브러리 받기" 층이 다음 빌드에서 재사용됨 → 두 번째부터 빨라짐
          #   mode=max : 1단(build) 중간 층까지 전부 저장
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===================================================================
  # [추가]2026.11.14권성애 — ⑦-2 서버 자동 배포
  #   needs: build → 위 build job 이 성공해야만 실행 (이미지가 ghcr.io 에 올라간 뒤)
  #   흐름: GitHub 의 리눅스 서버 ──SSH(22)──▶ Lightsail ── 아래 명령들 실행
  #
  # ★ 주의: nginx/nginx.conf 를 2단계(443)로 바꾼 커밋은 "인증서를 받은 뒤" 에 push 할 것
  #   (이 job 이 nginx 를 새 설정으로 다시 만들기 때문에, 인증서가 없으면 nginx 가 안 뜬다)
  # ===================================================================
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # ① SSH 개인 키를 GitHub 리눅스 서버의 ~/.ssh 에 파일로 놓기
      #   secrets.SERVER_SSH_KEY 는 로그에 *** 로 가려져서 나온다 (값이 화면에 안 보임)
      #   chmod 600 : 개인 키는 나만 읽기 (권한이 넓으면 ssh 가 "UNPROTECTED PRIVATE KEY" 로 거부)
      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 서버의 "신분증(호스트 키)" 을 미리 받아 known_hosts 에 등록
          #   → 처음 접속할 때 나오는 "Are you sure you want to continue connecting (yes/no)?" 질문을 없앰
          #   (자동 실행이라 yes 를 칠 사람이 없음)
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      # ② 서버에 접속해서 배포 명령 실행
      #   ssh ... 'bash -s' << 'EOS' ... EOS
      #     = EOS 사이의 줄들을 서버의 bash 에 그대로 넘겨 실행 (서버 터미널에 직접 친 것과 같음)
      #     'EOS' 처럼 따옴표로 감싸면 여기(GitHub 쪽)에서 $변수 를 풀지 않고 서버 쪽에서 푼다
      - name: 서버에 배포 (git pull → 이미지 pull → up -d)
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" 'bash -s' << 'EOS'
          set -e                                  # 한 줄이라도 실패하면 바로 멈춤 (뒤 명령을 이어 하지 않음) → Actions 빨간 X
          cd ~/bustour

          # (1) 코드 최신으로 (docker-compose.yml · nginx.conf · db 등 서버가 쓰는 파일)
          BEFORE=$(git rev-parse HEAD)            # pull 전 커밋 번호 기억
          git pull --ff-only                      # --ff-only : 서버에서 파일을 고쳐 충돌이 나면 합치지 말고 실패
                                                  #   (서버에서는 .env 말고 아무 파일도 고치지 않는 게 규칙)

          # (2) 새 앱 이미지 받기 → 바뀐 컨테이너만 다시 만들기
          docker compose pull app                 # app 만 (mysql · nginx 는 고정 버전이라 매번 받을 필요 없음)
          docker compose up -d                    # 이미지 · compose 설정이 바뀐 서비스만 새로 만든다
                                                  #   mysql 은 그대로 → DB 데이터 · 연결 유지

          # (3) nginx 설정 파일이 이번에 바뀌었으면 nginx 만 다시 만들기
          #   nginx.conf 는 "파일 하나" 를 끼워 둔 것이라 git pull 뒤에도 컨테이너가 옛 파일을 볼 수 있음
          #   git diff --name-only 이전 현재 = 이번에 바뀐 파일 목록 → nginx/ 로 시작하는 게 있으면
          if git diff --name-only "$BEFORE" HEAD | grep -q '^nginx/'; then
            echo "nginx 설정이 바뀌어 nginx 를 다시 만듭니다"
            docker compose up -d --force-recreate nginx
          fi

          # (4) 앱이 정말 떴는지 확인 — 최대 60초 (3초 × 20번)
          #   curl 이 들어 있는 아주 작은 이미지(curlimages/curl)를 잠깐 띄워
          #   도커 내부 네트워크(bustour_default)에서 app:8282/ping 을 직접 부른다
          #   → http/https 단계와 상관없이 "앱 자체" 를 확인할 수 있음
          for i in $(seq 1 20); do
            if docker run --rm --network bustour_default curlimages/curl -fsS http://app:8282/ping > /dev/null 2>&1; then
              echo "배포 성공: /ping 정상 (${i}번째 확인)"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "배포 실패: 60초 안에 /ping 응답 없음 → 앱 로그 마지막 50줄"
              docker compose logs --tail 50 app
              exit 1
            fi
            sleep 3
          done

          # (5) 이름표가 떨어진 옛 이미지 정리 (디스크가 차는 것 방지)
          docker image prune -f
          EOS
