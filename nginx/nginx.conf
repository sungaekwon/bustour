# =====================================================================
# nginx.conf : bustour.trave2026.kro.kr 사이트 설정 (10단계)
# [추가]2026.11.13권성애
#
# docker-compose.yml 이 이 파일을 nginx 컨테이너의 /etc/nginx/conf.d/default.conf 자리에 끼운다.
# (nginx 본체 설정 /etc/nginx/nginx.conf 는 이미지 기본값 그대로 쓰고, 여기는 server 블록만)
#
# ★ 2단계로 사용한다 — 인증서가 없는데 443 설정이 있으면 nginx 가 아예 안 뜨기 때문
#
#   [1단계] 인증서 받기 전 (지금 이 상태)
#     - 아래 [A] 블록만 켜져 있음 : 80 번으로 앱 연결 + certbot 확인 파일 제공
#     - http://bustour.trave2026.kro.kr/ping 로 앱이 뜬 것 확인
#     - docker compose run --rm certbot  → 인증서 발급
#
#   [2단계] 인증서 받은 뒤
#     1) [A] 블록 안의 "location / { proxy ... }" 를 주석 처리하고
#        바로 아래 "return 301 https://..." 줄의 주석을 푼다
#     2) 맨 아래 [B] 블록(443) 전체의 주석을 푼다 (각 줄 맨 앞 # 하나씩 지우기)
#     3) docker compose exec nginx nginx -t       ← 문법 검사 (successful 이 나와야 함)
#        docker compose exec nginx nginx -s reload ← 재시작 없이 설정만 다시 읽기
#
# ※ 이 파일은 BOM 없는 UTF-8 로 저장해야 한다 (BOM 이 있으면 nginx 가 첫 줄을 못 읽고 안 뜸)
# =====================================================================


# ---------------------------------------------------------------------
# [A] 80 번 (http)
# ---------------------------------------------------------------------
server {
    listen 80;
    server_name bustour.trave2026.kro.kr;

    # Let's Encrypt 확인용 경로 — 1단계 · 2단계 모두 항상 필요 (90일마다 갱신할 때도 씀)
    #   certbot 이 /var/www/certbot/.well-known/acme-challenge/파일 을 만들면
    #   Let's Encrypt 서버가 http://도메인/.well-known/acme-challenge/파일 로 확인하러 온다
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ----- [1단계] 인증서 받기 전: 80 번으로 바로 앱 연결 -----
    location / {
        proxy_pass http://app:8282;     # app = docker-compose 의 서비스 이름 (도커가 IP 로 바꿔 줌)
        proxy_set_header Host              $host;                        # 원래 도메인
        proxy_set_header X-Real-IP         $remote_addr;                 # 손님 IP
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;   # 거쳐 온 IP 목록
        proxy_set_header X-Forwarded-Proto $scheme;                      # http / https
    }

    # ----- [2단계] 인증서 받은 뒤: 위 location / 블록을 주석 처리하고 아래 줄 주석 풀기 -----
    # location / {
    #     return 301 https://$host$request_uri;    # http 로 오면 https 주소로 영구 이동
    # }
}


